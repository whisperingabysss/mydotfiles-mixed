# Main options
# ----------------
font = "JetBrains Mono:weight=normal:size=13"
dpi-aware = auto
prompt = "❯ "
placeholder = "Search..."
icons-enabled = yes
icon-theme = Adwaita                       # monochrome-friendly
anchor = center
width = 23       # percent of screen, smaller = more square-ish
lines = 8        # fewer lines → mini rectangle
line-height = 25 # taller for bigger font and icons
hide-before-typing = no
match-mode = fuzzy 

# ----------------
# Colors (RGBA)
# ----------------
[colors]
background = 000000ff       # black
text = ffffffff             # white
prompt = ffffffff           # white
placeholder = ffffffff      # white
input = ffffffff            # white
match = ffffffff
selection = 000000ff        # black
selection-text = ffffffff   # white
selection-match = ffffffff
counter = ffffffff
border = ffffffff           # white border

# ----------------
# Border
# ----------------
[border]
width = 2
radius = 20
selection-radius = 2

# ----------------
# dmenu mode defaults
# ----------------
[dmenu]
mode = text
exit-immediately-if-empty = no

# ----------------
# Key bindings
# ----------------
[key-bindings]
# defaults
