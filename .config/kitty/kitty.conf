
# ── Font ─────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Background & foreground ───────────────────────
background          #202331
foreground          #D7D9E5
background_opacity  0.92
background_blur     12

# ── Cursor ────────────────────────────────────────
cursor              #C4BDF0
cursor_text_color   #202331
cursor_shape        beam
cursor_beam_thickness 1.5

# ── Selection ─────────────────────────────────────
selection_foreground #F0F0FA
selection_background #45465F

# ── URL & borders ─────────────────────────────────
url_color           #B8C5E8
active_border_color #AAA4D8
inactive_border_color #343747
bell_border_color   #D9A7C7
visual_bell_color   #45465F

# ── Window layout ─────────────────────────────────
window_padding_width 12
hide_window_decorations yes
remember_window_size no
confirm_os_window_close 0

# ── Tabs ──────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground #202331
active_tab_background #C4BDF0
inactive_tab_foreground #A9ACBF
inactive_tab_background #2B2E40

# ── Scrollback ────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Terminal colors ───────────────────────────────
# Normal
color0  #292C3B
color1  #D38A9B
color2  #A5C5B0
color3  #DCC7A1
color4  #9CB7E0
color5  #B9A6D9
color6  #91C8D0
color7  #D7D9E5

# Bright
color8  #666A80
color9  #E5A1B0
color10 #BBD9C5
color11 #E9D5B1
color12 #B3C9F0
color13 #D0BDEC
color14 #A8DCE2
color15 #F2F1FA
